[project]
name = "haihe-girl-rag-anchor"
version = "0.1.0"
description = "海河少女可信 RAG 天津文化 AI 虚拟主播"
requires-python = ">=3.11"
dependencies = [
  "dashscope>=1.25.11",
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "numpy>=2.1.0",
  "pydantic-settings>=2.6.0",
  "pypdf>=5.0.0",
  "python-docx>=1.1.2",
  "python-dotenv>=1.0.1",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]
docs = [
  "pillow>=11.0.0",
  "reportlab>=4.2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["."]
